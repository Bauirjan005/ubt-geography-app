<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ҰБТ География — Оқушы кабинеті</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:    #1a3d2b;
      --forest2:   #254d37;
      --forest3:   #2f6044;
      --earth:     #c4934a;
      --earth-l:   #f5e9d6;
      --earth-d:   #9b6e2e;
      --ocean:     #1e4d6b;
      --ocean-l:   #dceef7;
      --parchment: #f8f3ea;
      --paper:     #ffffff;
      --ink:       #1c1c1a;
      --ink2:      #3a3a36;
      --muted:     #8a8578;
      --border:    #ddd6c8;
      --correct:   #1e6e3e;
      --correct-l: #d4edda;
      --wrong:     #b03020;
      --wrong-l:   #fde8e4;
      --serif:     'Playfair Display', Georgia, serif;
      --sans:      'Noto Sans', sans-serif;
      --radius:    10px;
    }

    html { background: var(--parchment); color: var(--ink); font-family: var(--sans); font-size: 15px; }

    .geo-stripe {
      height: 4px;
      background: linear-gradient(90deg, var(--forest) 0%, var(--forest3) 30%, var(--earth) 60%, var(--ocean) 100%);
    }

    /* ── Header ── */
    header {
      background: var(--forest);
      padding: 0 40px; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-wrap { display: flex; align-items: center; gap: 14px; }
    .logo-globe {
      width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--ocean-l), var(--ocean));
      border: 2px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .logo-text { display: flex; flex-direction: column; gap: 1px; }
    .logo-main { font-family: var(--serif); font-size: 18px; color: #fff; letter-spacing: .3px; }
    .logo-sub  { font-size: 11px; color: rgba(255,255,255,.55); letter-spacing: .8px; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .student-badge {
      background: rgba(30,77,107,.35); border: 1px solid rgba(255,255,255,.2);
      color: rgba(255,255,255,.85); padding: 5px 14px; border-radius: 20px;
      font-size: 12px;
    }
    .btn-exit {
      background: none; border: 1px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.7); padding: 7px 18px; border-radius: var(--radius);
      font-family: var(--sans); font-size: 13px; cursor: pointer; transition: all .2s;
    }
    .btn-exit:hover { border-color: rgba(255,255,255,.6); color: #fff; }

    /* ── Layout ── */
    .shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 72px);
    }

    /* ── Sidebar ── */
    aside {
      background: var(--paper);
      border-right: 1px solid var(--border);
      padding: 28px 20px;
      display: flex; flex-direction: column;
    }
    .aside-heading {
      font-family: var(--serif); font-size: 20px; color: var(--forest);
      margin-bottom: 4px;
    }
    .aside-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }

    .search-box {
      position: relative; margin-bottom: 16px;
    }
    .search-box input {
      width: 100%; padding: 9px 12px 9px 34px;
      background: var(--parchment); border: 1.5px solid var(--border);
      border-radius: var(--radius); font-family: var(--sans); font-size: 13px;
      color: var(--ink); outline: none; transition: border-color .2s;
    }
    .search-box input:focus { border-color: var(--forest); }
    .search-box .s-icon {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%); font-size: 14px; pointer-events: none;
    }

    .lesson-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
    .lesson-card {
      background: var(--parchment); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      cursor: pointer; transition: all .18s;
      animation: cardIn .3s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .lesson-card:hover {
      border-color: var(--forest); background: #fff;
      transform: translateX(3px);
    }
    .lesson-card.active {
      border-color: var(--forest); background: #fff;
      box-shadow: 3px 0 0 var(--forest) inset;
    }
    .lesson-card.done { opacity: .75; }
    .lc-title {
      font-family: var(--serif); font-size: 14px; color: var(--ink);
      margin-bottom: 6px; line-height: 1.35;
    }
    .lc-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--muted);
    }
    .badge {
      padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 600;
    }
    .badge-new  { background: var(--earth-l); color: var(--earth-d); }
    .badge-done { background: var(--correct-l); color: var(--correct); }

    /* ── Main pane ── */
    main { padding: 40px 48px; overflow-y: auto; }

    /* Empty state */
    .empty {
      display: flex; flex-direction: column;
      align-items: flex-start; padding-top: 60px;
    }
    .empty-art { font-size: 56px; margin-bottom: 20px; opacity: .3; }
    .empty h2 {
      font-family: var(--serif); font-size: 28px; color: var(--forest);
      margin-bottom: 10px; line-height: 1.2;
    }
    .empty p { color: var(--muted); font-size: 14px; max-width: 340px; line-height: 1.65; }

    /* ── Lesson view ── */
    .lesson-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--earth-d); margin-bottom: 8px;
    }
    .lesson-heading {
      font-family: var(--serif); font-size: 30px; color: var(--forest);
      line-height: 1.15; margin-bottom: 6px;
    }
    .lesson-meta { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    /* Study material */
    .material-box {
      background: var(--paper); border: 1px solid var(--border);
      border-left: 4px solid var(--ocean);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 22px 26px; margin-bottom: 36px;
    }
    .material-label {
      font-size: 10px; font-weight: 600; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--ocean); margin-bottom: 10px;
    }
    .material-text { font-size: 14px; line-height: 1.75; color: var(--ink2); white-space: pre-line; }

    /* Quiz section */
    .quiz-heading {
      font-family: var(--serif); font-size: 22px; color: var(--forest);
      margin-bottom: 20px;
    }

    /* Question */
    .q-block {
      background: var(--paper); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px 28px; margin-bottom: 16px;
      animation: fadeUp .3s ease both;
    }
    .q-block:nth-child(1){animation-delay:.04s}
    .q-block:nth-child(2){animation-delay:.08s}
    .q-block:nth-child(3){animation-delay:.12s}
    .q-block:nth-child(4){animation-delay:.16s}
    .q-block:nth-child(5){animation-delay:.20s}
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .q-num { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .q-text { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 18px; line-height: 1.5; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 10px;
      border: 1.5px solid var(--border);
      cursor: pointer; transition: all .18s; user-select: none;
    }
    .option:hover:not(.locked) { border-color: var(--forest); background: var(--parchment); }
    .option.selected:not(.locked) { border-color: var(--forest2); background: rgba(26,61,43,.06); }
    .option.correct { border-color: var(--correct); background: var(--correct-l); animation: pop .25s ease; }
    .option.wrong   { border-color: var(--wrong); background: var(--wrong-l); }
    @keyframes pop { 50% { transform: scale(1.015); } }

    .opt-badge {
      width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
      background: var(--parchment); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--muted);
      transition: all .18s;
    }
    .option.selected:not(.locked) .opt-badge { background: var(--forest); color: #fff; border-color: var(--forest); }
    .option.correct .opt-badge { background: var(--correct); color: #fff; border-color: var(--correct); }
    .option.wrong   .opt-badge { background: var(--wrong); color: #fff; border-color: var(--wrong); }
    .opt-text { font-size: 14px; color: var(--ink2); line-height: 1.4; }

    .feedback {
      font-size: 12px; font-weight: 500; margin-top: 10px;
      opacity: 0; transition: opacity .2s; display: flex; align-items: center; gap: 6px;
    }
    .feedback.show { opacity: 1; }
    .feedback.ok  { color: var(--correct); }
    .feedback.err { color: var(--wrong); }

    /* Submit bar */
    .submit-bar {
      display: flex; align-items: center; gap: 20px;
      padding: 24px 0; border-top: 1px solid var(--border); margin-top: 16px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: var(--radius);
      font-family: var(--sans); font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; transition: all .2s;
    }
    .btn-primary { background: var(--forest); color: #fff; }
    .btn-primary:hover { background: var(--forest3); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,61,43,.3); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--ink2); }
    .btn-outline:hover { border-color: var(--forest); color: var(--forest); }
    .submit-hint { font-size: 13px; color: var(--muted); }

    /* Score card */
    .score-card {
      background: var(--paper); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px; text-align: center; margin-bottom: 32px;
      animation: scaleIn .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
    .score-emoji { font-size: 52px; margin-bottom: 16px; }
    .score-num { font-family: var(--serif); font-size: 58px; color: var(--forest); line-height: 1; }
    .score-lbl { font-size: 14px; color: var(--muted); margin: 8px 0 20px; }
    .score-bar-wrap { height: 8px; background: var(--parchment); border-radius: 4px; overflow: hidden; max-width: 280px; margin: 0 auto 24px; }
    .score-bar { height: 100%; background: var(--forest3); border-radius: 4px; transition: width 1.1s cubic-bezier(.4,0,.2,1); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div class="geo-stripe"></div>

<header>
  <div class="logo-wrap">
    <div class="logo-globe">🌍</div>
    <div class="logo-text">
      <div class="logo-main">ҰБТ География</div>
      <div class="logo-sub">оқыту платформасы</div>
    </div>
  </div>
  <div class="header-right">
    <div class="student-badge">🎓 Оқушы</div>
    <button class="btn-exit" onclick="logout()">Шығу</button>
  </div>
</header>

<div class="shell">
  <!-- ── Sidebar ── -->
  <aside>
    <div class="aside-heading">Сабақтар</div>
    <div class="aside-sub">Тест тапсыру үшін сабақты таңдаңыз</div>

    <div class="search-box">
      <span class="s-icon">🔍</span>
      <input type="text" id="search" placeholder="Сабақ іздеу..." oninput="filterLessons()"/>
    </div>

    <div class="lesson-list" id="lesson-list">
      <div style="font-size:13px;color:var(--muted);padding:8px 4px">Жүктелуде...</div>
    </div>
  </aside>

  <!-- ── Quiz pane ── -->
  <main id="main-pane">
    <div class="empty">
      <div class="empty-art">🗺️</div>
      <h2>Сабақ таңдаңыз</h2>
      <p>Сол жақтан кез келген Geography сабағын таңдаңыз. Теориялық материалды оқып, тест тапсырыңыз.</p>
    </div>
  </main>
</div>

<script>
  let allLessons   = [];
  let activeLesson = null;
  let answers      = {};
  let submitted    = false;

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    try {
      const r = await fetch('/api/student/lessons');
      if (r.ok) { const d = await r.json(); allLessons = d.lessons || []; }
    } catch (_) {
      allLessons = [
        { id: 1, title: 'Қазақстанның физикалық географиясы', question_count: 4, completed: false },
        { id: 2, title: 'Дүниежүзі мұхиттары', question_count: 5, completed: true, score: 4 },
        { id: 3, title: 'Климат белдеулері', question_count: 4, completed: false },
        { id: 4, title: 'Ішкі сулар', question_count: 5, completed: false },
      ];
    }
    renderList(allLessons);
  }

  // ── Lesson list ────────────────────────────────────────────────────────────
  function renderList(lessons) {
    const el = document.getElementById('lesson-list');
    if (!lessons.length) {
      el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:8px 4px">Сабақ табылмады</div>';
      return;
    }
    el.innerHTML = lessons.map((l, i) => `
      <div class="lesson-card ${l.completed?'done':''} ${activeLesson?.id===l.id?'active':''}"
           style="animation-delay:${i*.06}s"
           onclick="openLesson(${l.id})">
        <div class="lc-title">${l.title}</div>
        <div class="lc-meta">
          <span>${l.question_count ?? '?'} сұрақ</span>
          ${l.completed
            ? `<span class="badge badge-done">✓ ${l.score}/${l.question_count}</span>`
            : `<span class="badge badge-new">жаңа</span>`}
        </div>
      </div>`).join('');
  }

  function filterLessons() {
    const q = document.getElementById('search').value.toLowerCase();
    renderList(allLessons.filter(l => l.title.toLowerCase().includes(q)));
  }

  // ── Open lesson ────────────────────────────────────────────────────────────
  async function openLesson(id) {
    answers = {}; submitted = false;
    document.getElementById('main-pane').innerHTML =
      '<div style="padding:80px 0;text-align:center;color:var(--muted);font-size:13px">Жүктелуде...</div>';

    let data;
    try {
      const r = await fetch(`/api/student/lessons/${id}`);
      if (r.ok) data = await r.json();
    } catch (_) {}

    if (!data) {
      data = {
        id, title: allLessons.find(l=>l.id===id)?.title || 'Сабақ',
        content: `Қазақстан — Орталық Азиядағы ең үлкен мемлекет. Аумағы 2 724 902 км². Жер бедері алуан түрлі: батысында Каспий маңы ойпаты, шығысында Алтай таулары.

Негізгі өзендер: Ертіс, Сырдария, Іле, Жайық.
Ең биік нүкте: Хан Тәңірі (6 995 м).
Климат: континентальды, жазы ыстық, қысы суық.`,
        questions: [
          { id:1, text:'Қазақстанның аумағы қанша км²?', option_a:'1 млн', option_b:'2 724 902', option_c:'3 млн', option_d:'500 000', correct_option:'B' },
          { id:2, text:'Хан Тәңірі тауының биіктігі?', option_a:'5 000 м', option_b:'7 010 м', option_c:'6 995 м', option_d:'4 500 м', correct_option:'C' },
          { id:3, text:'Қазақстанның ең ұзын өзені?', option_a:'Іле', option_b:'Ертіс', option_c:'Жайық', option_d:'Сырдария', correct_option:'B' },
          { id:4, text:'Қазақстан қай аймақта орналасқан?', option_a:'Шығыс Азия', option_b:'Оңтүстік Азия', option_c:'Орталық Азия', option_d:'Батыс Азия', correct_option:'C' },
        ]
      };
    }

    activeLesson = data;
    renderList(allLessons);
    renderQuiz(data);
  }

  // ── Render quiz ────────────────────────────────────────────────────────────
  function renderQuiz(lesson) {
    const pane = document.getElementById('main-pane');
    const qc = lesson.questions?.length ?? 0;
    pane.innerHTML = `
      <div class="lesson-eyebrow">География сабағы</div>
      <div class="lesson-heading">${lesson.title}</div>
      <div class="lesson-meta">${qc} тест сұрағы</div>

      ${lesson.content ? `
        <div class="material-box">
          <div class="material-label">📖 Оқу материалы</div>
          <div class="material-text">${lesson.content}</div>
        </div>` : ''}

      ${qc > 0 ? `
        <div class="quiz-heading">Тест сұрақтары</div>
        <div id="q-list">
          ${lesson.questions.map((q,i) => renderQ(q,i)).join('')}
        </div>
        <div class="submit-bar">
          <button class="btn btn-primary" id="btn-sub" onclick="submitQuiz()" disabled>
            ✅ Жауаптарды тексеру
          </button>
          <span class="submit-hint" id="sub-hint">Барлық сұрақтарға жауап беріңіз</span>
        </div>` : `
        <p style="font-size:14px;color:var(--muted)">Бұл сабаққа сұрақтар әлі қосылмаған.</p>`}`;
  }

  function renderQ(q, i) {
    const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
    return `
      <div class="q-block" id="qb-${i}">
        <div class="q-num">Сұрақ ${String(i+1).padStart(2,'0')}</div>
        <div class="q-text">${q.text}</div>
        <div class="options">
          ${['A','B','C','D'].map((l,li) => `
            <div class="option" id="opt-${i}-${l}" onclick="pick(${i},'${l}','${q.correct_option}')">
              <div class="opt-badge">${l}</div>
              <div class="opt-text">${opts[li]}</div>
            </div>`).join('')}
        </div>
        <div class="feedback" id="fb-${i}"></div>
      </div>`;
  }

  // ── Interaction ────────────────────────────────────────────────────────────
  function pick(qi, letter, correct) {
    if (submitted) return;
    ['A','B','C','D'].forEach(l => document.getElementById(`opt-${qi}-${l}`)?.classList.remove('selected'));
    document.getElementById(`opt-${qi}-${letter}`)?.classList.add('selected');
    answers[qi] = letter;
    updateBtn();
  }

  function updateBtn() {
    const total = activeLesson?.questions?.length ?? 0;
    const done  = Object.keys(answers).length;
    const btn   = document.getElementById('btn-sub');
    const hint  = document.getElementById('sub-hint');
    if (!btn) return;
    btn.disabled = done < total;
    hint.textContent = done < total
      ? `${done}/${total} сұраққа жауап берілді`
      : 'Барлық сұрақтарға жауап берілді — дайынсыз!';
  }

  function submitQuiz() {
    if (submitted) return;
    submitted = true;
    document.getElementById('btn-sub').disabled = true;

    let score = 0;
    activeLesson.questions.forEach((q, i) => {
      const chosen  = answers[i];
      const correct = q.correct_option;
      const ok = chosen === correct;
      if (ok) score++;

      ['A','B','C','D'].forEach(l => document.getElementById(`opt-${i}-${l}`)?.classList.add('locked'));

      document.getElementById(`opt-${i}-${correct}`)?.classList.add('correct');
      if (!ok && chosen) document.getElementById(`opt-${i}-${chosen}`)?.classList.add('wrong');

      const fb = document.getElementById(`fb-${i}`);
      if (fb) {
        fb.innerHTML = ok ? '✅ Дұрыс!' : `❌ Дұрыс жауап: <strong>${correct}</strong>`;
        fb.className = `feedback show ${ok ? 'ok' : 'err'}`;
      }
    });

    // Save attempt
    const total = activeLesson.questions.length;
    fetch(`/api/student/lessons/${activeLesson.id}/attempt`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ score, total })
    }).catch(() => {});

    const lesson = allLessons.find(l => l.id === activeLesson.id);
    if (lesson) { lesson.completed = true; lesson.score = score; }
    renderList(allLessons);

    // Score card
    const pct   = Math.round(score / total * 100);
    const emoji = pct === 100 ? '🏆' : pct >= 70 ? '🌟' : pct >= 40 ? '📖' : '💪';
    const card  = document.createElement('div');
    card.className = 'score-card';
    card.innerHTML = `
      <div class="score-emoji">${emoji}</div>
      <div class="score-num">${score}/${total}</div>
      <div class="score-lbl">${pct}% дұрыс жауап</div>
      <div class="score-bar-wrap"><div class="score-bar" id="sbar" style="width:0%"></div></div>
      <button class="btn btn-outline" onclick="openLesson(${activeLesson.id})">🔄 Қайта тапсыру</button>`;
    const qlist = document.getElementById('q-list');
    qlist?.parentNode.insertBefore(card, qlist);
    setTimeout(() => { document.getElementById('sbar').style.width = pct + '%'; }, 100);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login.html';
  }

  init();
</script>
</body>
</html>
