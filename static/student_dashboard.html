<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ҰБТ География — Оқушы кабинеті</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --forest:#0d5e38; --forest2:#127447; --forest3:#15803d;
      --earth:#059669;  --earth-l:#dcfce7; --earth-d:#065f46;
      --ocean:#0284c7;  --ocean-l:#e0f2fe;
      --parchment:#eef6fc; --paper:#ffffff;
      --ink:#0f1e29; --ink2:#1e293b; --muted:#64748b;
      --border:#cde0ef;
      --correct:#15803d; --correct-l:#dcfce7;
      --wrong:#dc2626;   --wrong-l:#fee2e2;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Noto Sans',sans-serif; --radius:10px;
    }
    html { background:var(--parchment); color:var(--ink); font-family:var(--sans); font-size:15px; }
    .geo-stripe { height:4px; background:linear-gradient(90deg,#09472a,#10b981 35%,#38bdf8 70%,#0284c7); }
    header { background:linear-gradient(135deg, #09472a 0%, #0d5e38 55%, #127447 100%); padding:0 36px; height:64px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 10px rgba(9,71,42,.2); }
    .logo-wrap { display:flex; align-items:center; gap:12px; }
    .geo-logo-badge { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.08); border:1.5px solid rgba(245,208,120,0.55); box-shadow:0 2px 10px rgba(0,0,0,.25),inset 0 1px 2px rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .25s ease; }
    .geo-logo-badge:hover { transform:scale(1.06); border-color:rgba(245,208,120,.85); box-shadow:0 4px 14px rgba(245,208,120,.35); }
    .logo-main { font-family:var(--serif); font-size:18px; color:#fff; }
    .logo-sub  { font-size:10px; color:rgba(255,255,255,.7); letter-spacing:.8px; text-transform:uppercase; }
    .student-badge { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500; }
    .btn-exit { background:none; border:1px solid rgba(255,255,255,.3); color:rgba(255,255,255,.85); padding:6px 16px; border-radius:var(--radius); font-family:var(--sans); font-size:13px; cursor:pointer; transition:all .2s; }
    .btn-exit:hover { border-color:#fff; color:#fff; background:rgba(255,255,255,.1); }
    /* Tab bar */
    .tab-bar { background:#09472a; display:flex; padding:0 36px; border-top:1px solid rgba(255,255,255,.1); }
    .tab-btn { padding:11px 20px; font-family:var(--sans); font-size:13px; color:rgba(255,255,255,.7); background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
    .tab-btn:hover { color:#fff; }
    .tab-btn.active { color:#fff; border-bottom-color:#4ade80; font-weight:600; }
    /* Layout */
    .shell { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 108px); }
    aside { background:var(--paper); border-right:1px solid var(--border); padding:22px 16px; display:flex; flex-direction:column; }
    .aside-heading { font-family:var(--serif); font-size:18px; color:var(--forest); margin-bottom:4px; }
    .aside-sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
    /* Progress bar */
    .progress-section { background:var(--parchment); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
    .progress-label { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px; }
    .progress-bar { height:7px; background:var(--border); border-radius:4px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--forest),var(--forest3)); border-radius:4px; transition:width .8s ease; }
    /* Search */
    .search-box { position:relative; margin-bottom:12px; }
    .search-box input { width:100%; padding:8px 12px 8px 30px; background:var(--parchment); border:1.5px solid var(--border); border-radius:var(--radius); font-family:var(--sans); font-size:13px; color:var(--ink); outline:none; transition:border-color .2s; }
    .search-box input:focus { border-color:var(--forest); }
    .s-icon { position:absolute; left:9px; top:50%; transform:translateY(-50%); font-size:13px; pointer-events:none; }
    .item-list { display:flex; flex-direction:column; gap:7px; overflow-y:auto; flex:1; }
    /* List cards */
    .list-card { background:var(--parchment); border:1.5px solid var(--border); border-radius:var(--radius); padding:12px 14px; cursor:pointer; transition:all .18s; animation:cardIn .3s ease both; }
    @keyframes cardIn { from{opacity:0;transform:translateX(-7px)} to{opacity:1;transform:translateX(0)} }
    .list-card:hover { border-color:var(--forest); background:#fff; transform:translateX(3px); }
    .list-card.active { border-color:var(--forest); background:#fff; box-shadow:3px 0 0 var(--forest) inset; }
    .lc-title { font-family:var(--serif); font-size:14px; color:var(--ink); margin-bottom:5px; line-height:1.3; }
    .lc-meta { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--muted); }
    .badge { padding:2px 8px; border-radius:12px; font-size:10px; font-weight:600; }
    .badge-new  { background:var(--earth-l); color:var(--earth-d); }
    .badge-done { background:var(--correct-l); color:var(--correct); }
    .diff-easy   { background:#d4edda; color:#2d6a40; }
    .diff-medium { background:#fff3cd; color:#856404; }
    .diff-hard   { background:#fde8e4; color:#b03020; }
    /* Main pane */
    main { padding:32px 40px; overflow-y:auto; }
    .empty { display:flex; flex-direction:column; align-items:flex-start; padding-top:40px; }
    .empty-art { font-size:50px; margin-bottom:16px; opacity:.28; }
    .empty h2 { font-family:var(--serif); font-size:24px; color:var(--forest); margin-bottom:8px; }
    .empty p { color:var(--muted); font-size:14px; max-width:300px; line-height:1.6; }
    /* Lesson view */
    .lesson-eyebrow { font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--earth-d); margin-bottom:6px; }
    .lesson-heading { font-family:var(--serif); font-size:26px; color:var(--forest); line-height:1.15; margin-bottom:5px; }
    .lesson-meta { font-size:13px; color:var(--muted); margin-bottom:24px; }
    .material-box { background:var(--paper); border:1px solid var(--border); border-left:4px solid var(--ocean); border-radius:0 var(--radius) var(--radius) 0; padding:18px 22px; margin-bottom:28px; }
    .material-label { font-size:10px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--ocean); margin-bottom:9px; }
    .material-text { font-size:14px; line-height:1.75; color:var(--ink2); white-space:pre-line; }
    .quiz-heading { font-family:var(--serif); font-size:20px; color:var(--forest); margin-bottom:16px; }
    /* Questions */
    .q-block { background:var(--paper); border:1px solid var(--border); border-radius:14px; padding:20px 24px; margin-bottom:13px; animation:fadeUp .3s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
    .q-num { font-size:10px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
    .q-text { font-size:15px; font-weight:500; color:var(--ink); margin-bottom:15px; line-height:1.5; }
    .options { display:flex; flex-direction:column; gap:9px; }
    .option { display:flex; align-items:center; gap:12px; padding:11px 15px; border-radius:10px; border:1.5px solid var(--border); cursor:pointer; transition:all .18s; user-select:none; }
    .option:hover:not(.locked) { border-color:var(--forest); background:var(--parchment); }
    .option.selected:not(.locked) { border-color:var(--forest2); background:rgba(26,61,43,.06); }
    .option.correct { border-color:var(--correct); background:var(--correct-l); animation:pop .25s ease; }
    .option.wrong   { border-color:var(--wrong);   background:var(--wrong-l); }
    @keyframes pop { 50%{transform:scale(1.012)} }
    .opt-badge { width:28px; height:28px; border-radius:7px; flex-shrink:0; background:var(--parchment); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--muted); transition:all .18s; }
    .option.selected:not(.locked) .opt-badge { background:var(--forest); color:#fff; border-color:var(--forest); }
    .option.correct .opt-badge { background:var(--correct); color:#fff; border-color:var(--correct); }
    .option.wrong   .opt-badge { background:var(--wrong);   color:#fff; border-color:var(--wrong); }
    .opt-text { font-size:14px; color:var(--ink2); line-height:1.4; }
    .feedback-box { border-radius:8px; padding:10px 14px; margin-top:10px; font-size:13px; line-height:1.6; display:none; }
    .feedback-box.show { display:block; animation:fadeUp .2s ease; }
    .feedback-box.ok  { background:var(--correct-l); border:1px solid rgba(30,110,62,.2); color:var(--correct); }
    .feedback-box.err { background:var(--wrong-l);   border:1px solid rgba(176,48,32,.2); color:var(--wrong); }
    /* Submit bar */
    .submit-bar { display:flex; align-items:center; gap:14px; padding:20px 0; border-top:1px solid var(--border); margin-top:14px; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; gap:7px; padding:10px 22px; border-radius:var(--radius); font-family:var(--sans); font-size:14px; font-weight:500; cursor:pointer; border:none; transition:all .2s; }
    .btn-primary { background:var(--forest); color:#fff; }
    .btn-primary:hover { background:var(--forest3); transform:translateY(-1px); box-shadow:0 4px 12px rgba(26,61,43,.3); }
    .btn-primary:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
    .btn-outline { background:none; border:1.5px solid var(--border); color:var(--ink2); }
    .btn-outline:hover { border-color:var(--forest); color:var(--forest); }
    .submit-hint { font-size:13px; color:var(--muted); }
    /* Score card */
    .score-card { background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:30px; text-align:center; margin-bottom:26px; animation:scaleIn .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes scaleIn { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
    .score-emoji { font-size:48px; margin-bottom:14px; }
    .score-num { font-family:var(--serif); font-size:52px; color:var(--forest); line-height:1; }
    .score-lbl { font-size:14px; color:var(--muted); margin:7px 0 18px; }
    .score-bar-wrap { height:8px; background:var(--parchment); border-radius:4px; overflow:hidden; max-width:260px; margin:0 auto 20px; }
    .score-bar { height:100%; background:var(--forest3); border-radius:4px; transition:width 1.1s cubic-bezier(.4,0,.2,1); }
    /* AI quiz one-by-one */
    .quiz-shell { max-width:660px; }
    .qprogress-wrap { margin-bottom:20px; }
    .qprogress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:6px; }
    .qprogress-fill { height:100%; background:var(--forest3); border-radius:3px; transition:width .4s ease; }
    .qprogress-label { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
    .q-card { background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:24px 28px; animation:slideQ .3s cubic-bezier(.34,1.2,.64,1) both; }
    @keyframes slideQ { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:translateX(0)} }
    .expl-box { background:var(--ocean-l); border:1px solid rgba(30,77,107,.2); border-radius:8px; padding:11px 14px; margin-top:12px; font-size:13px; color:var(--ocean); line-height:1.6; display:none; }
    .expl-box.show { display:block; animation:fadeUp .2s ease; }
    .q-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
    /* Material link */
    .material-link { display:inline-flex; align-items:center; gap:7px; background:var(--ocean-l); border:1px solid rgba(30,77,107,.2); color:var(--ocean); padding:8px 14px; border-radius:var(--radius); font-size:13px; text-decoration:none; margin-bottom:16px; transition:background .2s; }
    .material-link:hover { background:#c6e4f4; }
    .spinner { display:inline-block; width:17px; height:17px; border:2px solid var(--border); border-top-color:var(--forest); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>
<div class="geo-stripe"></div>
<header>
  <div class="logo-wrap">
    <div class="geo-logo-badge" title="ҰБТ География">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="geoOceanStud" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="45%" stop-color="#0284c7"/>
            <stop offset="85%" stop-color="#03446a"/>
            <stop offset="100%" stop-color="#082f49"/>
          </radialGradient>
          <linearGradient id="geoGoldStud" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
          </linearGradient>
          <linearGradient id="geoLandStud" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ade80"/>
            <stop offset="100%" stop-color="#15803d"/>
          </linearGradient>
        </defs>
        <!-- Brass Globe Stand Arc -->
        <path d="M8 8 A14 14 0 0 0 21 31" stroke="url(#geoGoldStud)" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 31 L18 34 M13 34 L23 34" stroke="url(#geoGoldStud)" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="8.8" cy="8.5" r="1.3" fill="#fef08a"/>
        <circle cx="20.5" cy="30.5" r="1.3" fill="#fef08a"/>
        <!-- Tilted Globe -->
        <g transform="rotate(-22 18 18)">
          <circle cx="18" cy="18" r="10.5" fill="url(#geoOceanStud)"/>
          <!-- Continents -->
          <path d="M15 11 C17 10.5, 19 11.5, 20.5 13 C21.5 14, 21 15.5, 19.5 16 C18 16.5, 17 18, 18 20 C18.5 21, 17.5 22.5, 16 22.5 C14.5 22.5, 14 20, 14.5 18 C15 16, 13.5 14.5, 13 13 C12.5 11.5, 14 11.5, 15 11 Z" fill="url(#geoLandStud)" opacity="0.95"/>
          <path d="M10 13 C11 12.5, 12 13.5, 11.5 15 C11 16.5, 9.5 18, 10.5 20 C11 21, 10.5 22, 9.5 21.5 C8.8 21, 8.5 18, 9 16 C9.5 14, 9 13.5, 10 13 Z" fill="url(#geoLandStud)" opacity="0.95"/>
          <circle cx="23" cy="20.5" r="1" fill="#4ade80" opacity="0.9"/>
          <!-- Parallels & Meridians -->
          <line x1="7.5" y1="18" x2="28.5" y2="18" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
          <path d="M9.5 13.5 Q18 15 26.5 13.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" fill="none"/>
          <path d="M9.5 22.5 Q18 21 26.5 22.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" fill="none"/>
          <line x1="18" y1="7.5" x2="18" y2="28.5" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
          <ellipse cx="18" cy="18" rx="5.5" ry="10.5" stroke="rgba(255,255,255,0.55)" stroke-width="0.75" fill="none"/>
          <path d="M11 10 A10.5 10.5 0 0 1 23 9" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        </g>
        <!-- Mini North star -->
        <path d="M29 6 L30 8 L32 9 L30 10 L29 12 L28 10 L26 9 L28 8 Z" fill="#fef08a" opacity="0.95"/>
      </svg>
    </div>
    <div>
      <div class="logo-main">ҰБТ География</div>
      <div class="logo-sub">оқыту платформасы</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="student-badge">🎓 <span id="current-user-name">Оқушы</span></div>
    <button class="btn-exit" onclick="logout()">Шығу</button>
  </div>
</header>
<div class="tab-bar">
  <button class="tab-btn active" id="mtab-lessons"   onclick="switchTab('lessons')">📚 Сабақтар</button>
  <button class="tab-btn"        id="mtab-aiquiz"    onclick="switchTab('aiquiz')">🤖 ИИ Тесттер</button>
  <button class="tab-btn"        id="mtab-materials" onclick="switchTab('materials')">📁 Материалдар</button>
</div>

<div class="shell">
  <aside>
    <div class="aside-heading" id="aside-title">Сабақтар</div>
    <div class="aside-sub" id="aside-sub">Тест тапсыру үшін таңдаңыз</div>
    <!-- Progress -->
    <div class="progress-section" id="progress-section" style="display:none">
      <div class="progress-label"><span>Прогресс</span><span id="progress-text">0/0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="search-box">
      <span class="s-icon">🔍</span>
      <input type="text" id="search" placeholder="Іздеу..." oninput="filterSidebar()"/>
    </div>
    <div class="item-list" id="sidebar-list">
      <div style="display:flex;justify-content:center;padding:20px"><div class="spinner"></div></div>
    </div>
  </aside>

  <main id="main-pane">
    <div class="empty">
      <div class="empty-art">🗺️</div>
      <h2>Қош келдіңіз!</h2>
      <p>Жоғарыдан бөлімді таңдаңыз. Сабақты немесе ИИ тестті бастаңыз.</p>
    </div>
  </main>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────────────
const _origFetch = window.fetch.bind(window);
window.fetch = async function(url, options = {}) {
  const merged = { ...options, credentials:'include', headers:{...(options.headers||{})} };
  let response;
  try { response = await _origFetch(url, merged); }
  catch(err) { console.error('[fetch]', url, err.message); throw err; }
  if (response.status === 401 && !location.pathname.includes('login.html')) {
    location.replace('/login.html'); return response;
  }
  return response;
};
async function checkAuth() {
  let user = null;
  try { const r = await _origFetch('/api/me',{credentials:'include'}); if(r.ok) user=await r.json(); }
  catch(_){}
  if (!user) { location.replace('/login.html'); return null; }
  if (!location.pathname.includes('student_dashboard')) return user;
  if (user.role !== 'student') { location.replace('/login.html'); return null; }
  const el = document.getElementById('current-user-name');
  if (el) el.textContent = user.username;
  return user;
}
checkAuth().then(user => { if(user && typeof init==='function') init(); });

// ── State ──────────────────────────────────────────────────────────────────────
let mainTab = 'lessons';
let allLessons=[], allAIQuizzes=[], allMaterials=[];
let activeLesson=null, aiQuiz=null;
let answers={}, submitted=false;
let aiSelected=null, qIndex=0, aiScore=0, qState='idle';

function init() {
  Promise.all([fetchLessons(), fetchAIQuizzes(), fetchMaterials()]).then(()=>renderSidebar());
}

// ── Fetch data ─────────────────────────────────────────────────────────────────
async function fetchLessons() {
  try { const r=await fetch('/api/student/lessons'); if(r.ok){const d=await r.json();allLessons=d.lessons||[];} }
  catch(_){}
}
async function fetchAIQuizzes() {
  try {
    const r = await fetch('/api/student/ai-quizzes', {
      credentials: 'include'
    });

    const text = await r.text();

    console.log('AI Quiz status:', r.status);
    console.log('AI Quiz response:', text);

    if (r.ok) {
      const d = JSON.parse(text);
      allAIQuizzes = d.quizzes || [];
    }
  } catch (error) {
    console.error('AI Quiz fetch error:', error);
  }
}
async function fetchMaterials() {
  try { const r=await fetch('/api/student/materials'); if(r.ok){const d=await r.json();allMaterials=d.materials||[];} }
  catch(_){}
}

// ── Tab switching ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  mainTab = tab;
  ['lessons','aiquiz','materials'].forEach(t => document.getElementById(`mtab-${t}`).classList.toggle('active',t===tab));
  activeLesson=null; aiQuiz=null;
  renderSidebar();
  setPane(`<div class="empty"><div class="empty-art">${tab==='aiquiz'?'🤖':tab==='materials'?'📁':'🗺️'}</div><h2>${tab==='aiquiz'?'ИИ тест таңдаңыз':tab==='materials'?'Материал таңдаңыз':'Сабақ таңдаңыз'}</h2><p>Сол жақтан таңдаңыз.</p></div>`);
}

// ── Sidebar ────────────────────────────────────────────────────────────────────
function renderSidebar() {
  const titles = {lessons:'Сабақтар', aiquiz:'ИИ Тесттер', materials:'Материалдар'};
  const subs   = {lessons:'Тест тапсыру үшін', aiquiz:'ИИ тест таңдаңыз', materials:'Оқу үшін таңдаңыз'};
  document.getElementById('aside-title').textContent = titles[mainTab];
  document.getElementById('aside-sub').textContent   = subs[mainTab];
  document.getElementById('search').value = '';

  // Progress bar (only for lessons)
  const ps = document.getElementById('progress-section');
  if (mainTab === 'lessons' && allLessons.length) {
    const done = allLessons.filter(l=>l.completed).length;
    const pct  = Math.round(done/allLessons.length*100);
    document.getElementById('progress-text').textContent = `${done}/${allLessons.length}`;
    document.getElementById('progress-fill').style.width = pct + '%';
    ps.style.display = '';
  } else {
    ps.style.display = 'none';
  }

  filterSidebar();
}

function filterSidebar() {
  const q = document.getElementById('search').value.toLowerCase();
  const el = document.getElementById('sidebar-list');

  if (mainTab === 'lessons') {
    const items = allLessons.filter(l=>l.title.toLowerCase().includes(q));
    el.innerHTML = items.length ? items.map((l,i)=>`
      <div class="list-card ${l.completed?'':''}  ${activeLesson?.id===l.id&&activeLesson?._type==='lesson'?'active':''}"
           style="animation-delay:${i*.05}s" onclick="openLesson(${l.id})">
        <div class="lc-title">${l.title}</div>
        <div class="lc-meta">
          <span>${l.question_count||0} сұрақ</span>
          ${l.completed?`<span class="badge badge-done">✓ ${l.score}/${l.total}</span>`:`<span class="badge badge-new">жаңа</span>`}
        </div>
      </div>`).join('') : '<div style="font-size:13px;color:var(--muted);padding:8px 4px">Сабақ жоқ</div>';

  } else if (mainTab === 'aiquiz') {
    const items = allAIQuizzes.filter(q2=>q2.title.toLowerCase().includes(q));
    el.innerHTML = items.length ? items.map((q2,i)=>`
      <div class="list-card ${aiQuiz?.id===q2.id?'active':''}" style="animation-delay:${i*.05}s" onclick="openAIQuiz(${q2.id})">
        <div class="lc-title">${q2.title}</div>
        <div class="lc-meta">
          <span>${q2.question_count} сұрақ</span>
          <span class="badge diff-${q2.difficulty}">${diffLabel(q2.difficulty)}</span>
        </div>
        ${q2.completed?`<div style="font-size:11px;color:var(--correct);margin-top:4px">✓ ${q2.score}/${q2.total} ұпай</div>`:''}
      </div>`).join('') : '<div style="font-size:13px;color:var(--muted);padding:8px 4px">ИИ тест жоқ</div>';

  } else {
    const items = allMaterials.filter(m=>m.title.toLowerCase().includes(q));
    el.innerHTML = items.length ? items.map((m,i)=>`
      <div class="list-card" style="animation-delay:${i*.05}s" onclick="openMaterial(${m.id},'${m.title.replace(/'/g,"\\'")}')">
        <div class="lc-title">${m.title}</div>
        <div class="lc-meta"><span>${m.original_name}</span><span>👁 ${m.view_count}</span></div>
      </div>`).join('') : '<div style="font-size:13px;color:var(--muted);padding:8px 4px">Материал жоқ</div>';
  }
}

// ── Open material ──────────────────────────────────────────────────────────────
function openMaterial(id, title) {
  setPane(`
    <div class="lesson-eyebrow">Оқу материалы</div>
    <div class="lesson-heading">${title}</div>
    <div style="margin-top:16px">
      <a class="material-link" href="/api/student/materials/${id}/view" target="_blank">📄 Файлды ашу</a>
      <p style="font-size:13px;color:var(--muted);margin-top:10px">Файл жаңа қойындыда ашылады. Көру саны автоматты тіркеледі.</p>
    </div>`);
}

// ── Regular lesson quiz ────────────────────────────────────────────────────────
async function openLesson(id) {
  answers={}; submitted=false;
  setPane(`<div style="display:flex;align-items:center;gap:12px;padding:50px 0;color:var(--muted);font-size:14px"><div class="spinner"></div> Жүктелуде...</div>`);
  let data;
  try { const r=await fetch(`/api/student/lessons/${id}`); if(r.ok) data=await r.json(); }
  catch(_){}
  if (!data) { setPane('<div style="padding:40px;color:var(--muted)">Жүктелмеді.</div>'); return; }
  activeLesson={...data,_type:'lesson'};
  filterSidebar();

  const qc = data.questions?.length ?? 0;
  setPane(`
    <div class="lesson-eyebrow">География сабағы</div>
    <div class="lesson-heading">${data.title}</div>
    <div class="lesson-meta">${qc} тест сұрағы</div>
    ${data.content?`<div class="material-box"><div class="material-label">📖 Оқу материалы</div><div class="material-text">${data.content}</div></div>`:''}
    ${qc>0?`
      <div class="quiz-heading">Тест сұрақтары</div>
      <div id="q-list">${data.questions.map((q,i)=>lessonQ(q,i)).join('')}</div>
      <div class="submit-bar">
        <button class="btn btn-primary" id="btn-sub" onclick="submitLesson()" disabled>✅ Жауаптарды тексеру</button>
        <span class="submit-hint" id="sub-hint">Барлық сұрақтарға жауап беріңіз</span>
      </div>`:
      '<p style="font-size:14px;color:var(--muted)">Сұрақтар қосылмаған.</p>'}`);
}

function lessonQ(q, i) {
  const opts=[q.option_a,q.option_b,q.option_c,q.option_d];
  return `
    <div class="q-block" style="animation-delay:${i*.06}s">
      <div class="q-num">Сұрақ ${String(i+1).padStart(2,'0')}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${['A','B','C','D'].map((l,li)=>`
          <div class="option" id="opt-${q.id}-${l}" onclick="pickLesson(${q.id},'${l}')">
            <div class="opt-badge">${l}</div>
            <div class="opt-text">${opts[li]}</div>
          </div>`).join('')}
      </div>
      <div class="feedback-box" id="fb-${q.id}"></div>
    </div>`;
}

function pickLesson(qid, letter) {
  if (submitted) return;
  ['A','B','C','D'].forEach(l=>document.getElementById(`opt-${qid}-${l}`)?.classList.remove('selected'));
  document.getElementById(`opt-${qid}-${letter}`)?.classList.add('selected');
  answers[qid]=letter;
  const total=activeLesson?.questions?.length??0;
  const done=Object.keys(answers).length;
  const btn=document.getElementById('btn-sub');
  if(btn) btn.disabled=done<total;
  const hint=document.getElementById('sub-hint');
  if(hint) hint.textContent=done<total?`${done}/${total} жауап берілді`:'Дайын!';
}

async function submitLesson() {
  if(submitted) return; submitted=true;
  document.getElementById('btn-sub').disabled=true;
  let result;
  try {
    const r=await fetch(`/api/student/lessons/${activeLesson.id}/attempt`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})
    });
    if(r.ok) result=await r.json();
  } catch(_){}
  if(!result){submitted=false;document.getElementById('btn-sub').disabled=false;return;}

  activeLesson.questions.forEach(q=>{
    const qid=String(q.id);
    const fb=result.feedback[qid];
    if(!fb)return;
    ['A','B','C','D'].forEach(l=>document.getElementById(`opt-${q.id}-${l}`)?.classList.add('locked'));
    document.getElementById(`opt-${q.id}-${fb.correct}`)?.classList.add('correct');
    if(!fb.is_right&&fb.chosen) document.getElementById(`opt-${q.id}-${fb.chosen}`)?.classList.add('wrong');
    const el=document.getElementById(`fb-${q.id}`);
    if(el){el.innerHTML=fb.is_right?'✅ Дұрыс!':`❌ Дұрыс жауап: <strong>${fb.correct}</strong>`;el.className=`feedback-box show ${fb.is_right?'ok':'err'}`;}
  });

  const lesson=allLessons.find(l=>l.id===activeLesson.id);
  if(lesson){lesson.completed=true;lesson.score=result.score;lesson.total=result.total;}
  renderSidebar();

  const pct=Math.round(result.score/result.total*100);
  const emoji=pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'📖':'💪';
  const card=document.createElement('div');
  card.className='score-card';
  card.innerHTML=`<div class="score-emoji">${emoji}</div><div class="score-num">${result.score}/${result.total}</div><div class="score-lbl">${pct}% дұрыс</div><div class="score-bar-wrap"><div class="score-bar" id="sbar" style="width:0%"></div></div><button class="btn btn-outline" onclick="openLesson(${activeLesson.id})">🔄 Қайта</button>`;
  const qlist=document.getElementById('q-list');
  qlist?.parentNode.insertBefore(card,qlist);
  setTimeout(()=>{const b=document.getElementById('sbar');if(b)b.style.width=pct+'%';},100);
  card.scrollIntoView({behavior:'smooth',block:'start'});
}

// ── AI Quiz one-question-at-a-time ────────────────────────────────────────────
async function openAIQuiz(id) {
  setPane(`<div style="display:flex;align-items:center;gap:12px;padding:50px 0;color:var(--muted);font-size:14px"><div class="spinner"></div> ИИ тест жүктелуде...</div>`);
  try {
    const r=await fetch(`/api/student/ai-quizzes/${id}`);
    if(!r.ok){setPane('<div style="padding:40px;color:var(--muted)">Тест жүктелмеді.</div>');return;}
    aiQuiz=await r.json();
  } catch(_){setPane('<div style="padding:40px;color:var(--muted)">Байланыс қатесі.</div>');return;}
  qIndex=0;aiScore=0;qState='idle';aiSelected=null;
  filterSidebar();
  renderAIQ();
}

function renderAIQ() {
  const q=aiQuiz.questions[qIndex];
  const total=aiQuiz.questions.length;
  const pct=Math.round(qIndex/total*100);
  setPane(`
    <div class="quiz-shell">
      <div class="lesson-eyebrow">ИИ Тест · <span class="badge diff-${aiQuiz.difficulty}">${diffLabel(aiQuiz.difficulty)}</span></div>
      <div class="lesson-heading" style="margin-bottom:18px">${aiQuiz.title}</div>
      <div class="qprogress-wrap">
        <div class="qprogress-bar"><div class="qprogress-fill" style="width:${pct}%"></div></div>
        <div class="qprogress-label"><span>Сұрақ ${qIndex+1} / ${total}</span><span>Ұпай: <strong>${aiScore}</strong></span></div>
      </div>
      <div class="q-card">
        <div class="q-num">Сұрақ ${String(qIndex+1).padStart(2,'0')}</div>
        <div class="q-text">${q.text}</div>
        <div class="options" id="ai-opts">
          ${['A','B','C','D'].map((l,li)=>`
            <div class="option" id="aopt-${l}" onclick="pickAI('${l}')">
              <div class="opt-badge">${l}</div>
              <div class="opt-text">${[q.option_a,q.option_b,q.option_c,q.option_d][li]}</div>
            </div>`).join('')}
        </div>
        <div class="expl-box" id="ai-expl"></div>
        <div class="q-actions" id="ai-actions">
          <button class="btn btn-primary" id="ai-submit" onclick="submitAIAnswer()" disabled>✅ Жауаптау</button>
          <span class="submit-hint" id="ai-hint">Жауапты таңдаңыз</span>
        </div>
      </div>
    </div>`);
  qState='idle';aiSelected=null;
}

function pickAI(letter) {
  if(qState!=='idle'&&qState!=='retrying') return;
  const el=document.getElementById(`aopt-${letter}`);
  if(el?.classList.contains('dimmed')) return;
  ['A','B','C','D'].forEach(l=>{const e=document.getElementById(`aopt-${l}`);if(e&&!e.classList.contains('dimmed'))e.classList.remove('selected');});
  el?.classList.add('selected');
  aiSelected=letter;
  document.getElementById('ai-submit').disabled=false;
  document.getElementById('ai-hint').textContent='';
}

function submitAIAnswer() {
  const q=aiQuiz.questions[qIndex];
  const correct=q.correct_option;
  const chosen=aiSelected;
  if(!chosen) return;
  const isRight=chosen===correct;
  const explEl=document.getElementById('ai-expl');
  const actions=document.getElementById('ai-actions');

  ['A','B','C','D'].forEach(l=>document.getElementById(`aopt-${l}`)?.classList.add('locked'));

  if(isRight){
    if(qState==='idle') aiScore++;
    document.getElementById(`aopt-${correct}`)?.classList.add('correct');
    qState='correct';
    if(q.explanation){explEl.textContent='💡 '+q.explanation;explEl.className='expl-box show';}
    actions.innerHTML=`
      <button class="btn btn-primary" onclick="nextAIQ()">${qIndex+1<aiQuiz.questions.length?'Келесі сұрақ →':'🏁 Нәтиже'}</button>
      <span class="submit-hint" style="color:var(--correct)">✅ Дұрыс! +1 ұпай</span>`;
  } else {
    document.getElementById(`aopt-${chosen}`)?.classList.add('wrong');
    if(qState==='idle'){
      // First wrong — allow retry
      qState='retrying';
      const wrongEl=document.getElementById(`aopt-${chosen}`);
      wrongEl?.classList.remove('locked');
      wrongEl?.classList.add('dimmed');
      ['A','B','C','D'].filter(l=>l!==chosen).forEach(l=>document.getElementById(`aopt-${l}`)?.classList.remove('locked'));
      explEl.innerHTML='❌ Қате! <strong>Тағы бір рет байқаңыз!</strong>';
      explEl.className='expl-box show err';
      aiSelected=null;
      actions.innerHTML=`<button class="btn btn-primary" id="ai-submit" onclick="submitAIAnswer()" disabled>✅ Жауаптау</button><span class="submit-hint" id="ai-hint">Басқа жауапты таңдаңыз</span>`;
    } else {
      // Second wrong — reveal answer
      document.getElementById(`aopt-${correct}`)?.classList.add('correct');
      qState='done';
      const msg=q.explanation?`❌ Дұрыс жауап: <strong>${correct}</strong>. ${q.explanation}`:`❌ Дұрыс жауап: <strong>${correct}</strong>`;
      explEl.innerHTML=msg; explEl.className='expl-box show err';
      actions.innerHTML=`<button class="btn btn-primary" onclick="nextAIQ()">${qIndex+1<aiQuiz.questions.length?'Келесі сұрақ →':'🏁 Нәтиже'}</button>`;
    }
  }
}

function nextAIQ() {
  aiSelected=null; qIndex++;
  if(qIndex>=aiQuiz.questions.length) finishAIQuiz();
  else { qState='idle'; renderAIQ(); }
}

async function finishAIQuiz() {
  const total=aiQuiz.questions.length;
  const pct=Math.round(aiScore/total*100);
  const emoji=pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':pct>=40?'📖':'💪';
  setPane(`
    <div class="quiz-shell">
      <div class="lesson-eyebrow">ИИ Тест нәтижесі</div>
      <div class="lesson-heading" style="margin-bottom:22px">${aiQuiz.title}</div>
      <div class="score-card">
        <div class="score-emoji">${emoji}</div>
        <div class="score-num">${aiScore}/${total}</div>
        <div class="score-lbl">${pct}% дұрыс · ${diffLabel(aiQuiz.difficulty)} деңгей</div>
        <div class="score-bar-wrap"><div class="score-bar" id="sbar" style="width:0%"></div></div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="openAIQuiz(${aiQuiz.id})">🔄 Қайта тапсыру</button>
          <button class="btn btn-outline" onclick="switchTab('aiquiz')">← Тізімге оралу</button>
        </div>
      </div>
    </div>`);
  setTimeout(()=>{const b=document.getElementById('sbar');if(b)b.style.width=pct+'%';},120);

  try {
    await fetch(`/api/student/ai-quizzes/${aiQuiz.id}/complete`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({score:aiScore,total})
    });
    await fetchAIQuizzes();
    filterSidebar();
  } catch(_){}
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function setPane(html) { document.getElementById('main-pane').innerHTML=html; }
function diffLabel(d) { return d==='easy'?'Жеңіл':d==='medium'?'Орта':'Қиын'; }
async function logout() { await fetch('/api/logout',{method:'POST'}); location.href='/login.html'; }
</script>
</body>
</html>
