<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ҰБТ География</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --forest:#1a3d2b; --forest2:#254d37; --forest3:#2f6044;
      --earth:#c4934a;  --earth-l:#f5e9d6; --earth-d:#9b6e2e;
      --ocean:#1e4d6b;  --ocean-l:#dceef7;
      --parchment:#f8f3ea; --paper:#fff;
      --ink:#1c1c1a; --ink2:#3a3a36; --muted:#8a8578;
      --border:#ddd6c8; --danger:#c0392b; --danger-l:#fde8e4;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Noto Sans',sans-serif; --radius:10px;
    }
    html, body {
      min-height:100vh;
      background:var(--parchment);
      font-family:var(--sans);
      display:flex;
      flex-direction:column;
    }
    .geo-stripe {
      height:4px;
      background:linear-gradient(90deg,var(--forest),var(--forest3) 30%,var(--earth) 60%,var(--ocean));
      flex-shrink:0;
    }
    .page {
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }
    .card {
      background:var(--paper);
      border:1px solid var(--border);
      border-radius:16px;
      padding:48px 44px;
      width:100%;
      max-width:440px;
      box-shadow:0 4px 32px rgba(26,61,43,.08);
    }
    .logo {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:32px;
    }
    .logo-globe {
      width:46px; height:46px; border-radius:50%;
      background:radial-gradient(circle at 35% 35%,var(--ocean-l),var(--ocean));
      border:2px solid rgba(30,77,107,.3);
      display:flex; align-items:center; justify-content:center;
      font-size:22px; flex-shrink:0;
    }
    .logo-main { font-family:var(--serif); font-size:20px; color:var(--forest); }
    .logo-sub  { font-size:11px; color:var(--muted); letter-spacing:.8px; text-transform:uppercase; }
    /* Tabs */
    .tabs {
      display:flex;
      background:var(--parchment);
      border-radius:10px;
      padding:4px;
      margin-bottom:28px;
      gap:4px;
    }
    .tab {
      flex:1; padding:9px; border:none; background:none;
      border-radius:7px; font-family:var(--sans); font-size:14px;
      color:var(--muted); cursor:pointer; transition:all .2s;
    }
    .tab.active {
      background:var(--paper); color:var(--forest);
      font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08);
    }
    /* Form */
    .form { display:flex; flex-direction:column; gap:16px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field label {
      font-size:12px; font-weight:600; letter-spacing:.4px;
      color:var(--ink); text-transform:uppercase;
    }
    .field input, .field select {
      background:var(--parchment); border:1.5px solid var(--border);
      border-radius:10px; color:var(--ink); font-family:var(--sans);
      font-size:14px; padding:12px 16px; outline:none; width:100%;
      transition:border-color .2s, background .2s;
    }
    .field input:focus, .field select:focus {
      border-color:var(--forest); background:#fff;
    }
    .btn-submit {
      background:var(--forest); color:#fff;
      border:none; border-radius:10px;
      padding:13px; font-family:var(--sans);
      font-size:15px; font-weight:500;
      cursor:pointer; transition:all .2s; margin-top:4px;
    }
    .btn-submit:hover {
      background:var(--forest3);
      transform:translateY(-1px);
      box-shadow:0 4px 14px rgba(26,61,43,.3);
    }
    .btn-submit:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
    .error-box {
      background:var(--danger-l); border:1px solid rgba(192,57,43,.25);
      border-radius:8px; padding:11px 14px;
      font-size:13px; color:var(--danger); display:none;
    }
    .error-box.show { display:block; animation:shake .3s ease; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25%      { transform:translateX(-6px); }
      75%      { transform:translateX(6px); }
    }
    .spinner {
      display:inline-block; width:16px; height:16px;
      border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
      border-radius:50%; animation:spin .6s linear infinite;
      vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    footer {
      text-align:center; padding:20px;
      font-size:12px; color:var(--muted); flex-shrink:0;
    }
  </style>
</head>
<body>
<div class="geo-stripe"></div>

<div class="page">
  <div class="card">
    <div class="logo">
      <div class="logo-globe">🌍</div>
      <div>
        <div class="logo-main">ҰБТ География</div>
        <div class="logo-sub">оқыту платформасы</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Войти</button>
      <button class="tab" id="tab-reg" onclick="switchTab('register')">Регистрация</button>
    </div>

    <div class="error-box" id="error-box"></div>

    <!-- LOGIN -->
    <div id="form-login">
      <div class="form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="teacher@ubt.kz" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-submit" id="btn-login" onclick="doLogin()">Войти</button>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="form-register" style="display:none">
      <div class="form">
        <div class="field">
          <label>Имя</label>
          <input type="text" id="reg-name" placeholder="Аяна Сейткали"/>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="teacher@ubt.kz"/>
        </div>
        <div class="field">
          <label>Пароль (мин. 8 символов, 1 заглавная, 1 цифра)</label>
          <input type="password" id="reg-password" placeholder="Secret123"/>
        </div>
        <div class="field">
          <label>Роль</label>
          <select id="reg-role">
            <option value="teacher">Мұғалім (Учитель)</option>
            <option value="student">Оқушы (Ученик)</option>
          </select>
        </div>
        <button class="btn-submit" id="btn-reg" onclick="doRegister()">Зарегистрироваться</button>
      </div>
    </div>
  </div>
</div>

<footer>ҰБТ География · оқыту платформасы</footer>

<script>
  // Если уже залогинен — редирект
  (async function() {
    try {
      const r = await fetch('/api/me', { credentials:'include' });
      if (r.ok) {
        const u = await r.json();
        if (u.role === 'teacher') location.replace('/teacher_dashboard.html');
        else location.replace('/student_dashboard.html');
      }
    } catch(_) {}
  })();

  function switchTab(tab) {
    document.getElementById('form-login').style.display    = tab==='login'    ? '' : 'none';
    document.getElementById('form-register').style.display = tab==='register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab==='login');
    document.getElementById('tab-reg').classList.toggle('active',   tab==='register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.className = 'error-box show';
  }
  function hideError() {
    document.getElementById('error-box').className = 'error-box';
  }

  function setBusy(btn, on) {
    btn.disabled = on;
    if (on) { btn._t = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>Загрузка...'; }
    else     { btn.innerHTML = btn._t; }
  }

  async function doLogin() {
    hideError();
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showError('Заполните все поля'); return; }

    const btn = document.getElementById('btn-login');
    setBusy(btn, true);
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const d = await r.json();
      if (!r.ok) { showError(d.message || 'Неверный email или пароль'); return; }
      if (d.role === 'teacher') location.replace('/teacher_dashboard.html');
      else location.replace('/student_dashboard.html');
    } catch(_) {
      showError('Нет соединения с сервером');
    } finally {
      setBusy(btn, false);
    }
  }

  async function doRegister() {
    hideError();
    const username = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const role     = document.getElementById('reg-role').value;

    if (!username || !email || !password) { showError('Заполните все поля'); return; }

    const btn = document.getElementById('btn-reg');
    setBusy(btn, true);
    try {
      const r = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, email, password, role })
      });
      const d = await r.json();
      if (!r.ok) { showError(d.message || 'Ошибка регистрации'); return; }

      // Авто-логин после регистрации
      const r2 = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const d2 = await r2.json();
      if (d2.role === 'teacher') location.replace('/teacher_dashboard.html');
      else location.replace('/student_dashboard.html');
    } catch(_) {
      showError('Нет соединения с сервером');
    } finally {
      setBusy(btn, false);
    }
  }

  // Enter пернесі
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('form-login').style.display !== 'none';
    if (loginVisible) doLogin(); else doRegister();
  });
</script>
</body>
</html>
