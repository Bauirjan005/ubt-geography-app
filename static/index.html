<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ҰБТ География</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --forest:#0d5e38; --forest2:#127447; --forest3:#15803d;
      --earth:#059669;  --earth-l:#dcfce7; --earth-d:#065f46;
      --ocean:#0284c7;  --ocean-l:#e0f2fe;
      --parchment:#eef6fc; --paper:#ffffff;
      --ink:#0f1e29; --ink2:#1e293b; --muted:#64748b;
      --border:#cde0ef; --danger:#dc2626; --danger-l:#fee2e2;
      --serif:'Playfair Display',Georgia,serif;
      --sans:'Noto Sans',sans-serif; --radius:10px;
    }
    html, body {
      min-height:100vh;
      background:var(--parchment);
      font-family:var(--sans);
      display:flex;
      flex-direction:column;
    }
    .geo-stripe {
      height:4px;
      background:linear-gradient(90deg,#09472a,#10b981 35%,#38bdf8 70%,#0284c7);
      flex-shrink:0;
    }
    .page {
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }
    .card {
      background:var(--paper);
      border:1px solid var(--border);
      border-radius:16px;
      padding:44px 40px;
      width:100%;
      max-width:440px;
      box-shadow:0 4px 32px rgba(26,61,43,.08);
    }
    .logo {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:28px;
    }
    .geo-logo-badge {
      width:42px; height:42px; border-radius:50%;
      background:rgba(26,61,43,0.06); border:1.5px solid rgba(196,147,74,0.5);
      box-shadow:0 2px 8px rgba(0,0,0,.08); display:flex;
      align-items:center; justify-content:center; flex-shrink:0;
      transition:all .25s ease;
    }
    .geo-logo-badge:hover { transform:scale(1.06); border-color:rgba(196,147,74,.8); }
    .logo-main { font-family:var(--serif); font-size:20px; color:var(--forest); font-weight:600; }
    .logo-sub  { font-size:11px; color:var(--muted); letter-spacing:.8px; text-transform:uppercase; }
    
    /* Tabs */
    .tabs {
      display:flex;
      background:var(--parchment);
      border-radius:10px;
      padding:4px;
      margin-bottom:24px;
      gap:4px;
    }
    .tab {
      flex:1; padding:10px; border:none; background:none;
      border-radius:7px; font-family:var(--sans); font-size:14px;
      color:var(--muted); cursor:pointer; transition:all .2s;
    }
    .tab.active {
      background:var(--paper); color:var(--forest);
      font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08);
    }

    /* Form */
    .form { display:flex; flex-direction:column; gap:16px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field label {
      font-size:12px; font-weight:600; letter-spacing:.4px;
      color:var(--ink); text-transform:uppercase;
    }
    .field input, .field select {
      background:var(--parchment); border:1.5px solid var(--border);
      border-radius:10px; color:var(--ink); font-family:var(--sans);
      font-size:14px; padding:12px 16px; outline:none; width:100%;
      transition:border-color .2s, background .2s;
    }
    .field input:focus, .field select:focus {
      border-color:var(--forest); background:#fff;
    }

    /* Password Input Wrapper with Eye toggle */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-wrapper input {
      padding-right: 46px !important;
    }
    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      transition: color .2s, background-color .2s;
      outline: none;
    }
    .btn-toggle-pw:hover {
      color: var(--forest);
      background-color: rgba(13,94,56,0.08);
    }
    .btn-toggle-pw:focus-visible {
      outline: 2px solid var(--forest);
    }
    .btn-toggle-pw svg {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .btn-submit {
      background:var(--forest); color:#fff;
      border:none; border-radius:10px;
      padding:13px; font-family:var(--sans);
      font-size:15px; font-weight:500;
      cursor:pointer; transition:all .2s; margin-top:4px;
    }
    .btn-submit:hover {
      background:var(--forest3);
      transform:translateY(-1px);
      box-shadow:0 4px 14px rgba(13,94,56,.3);
    }
    .btn-submit:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

    .error-box {
      background:var(--danger-l); border:1px solid rgba(192,57,43,.25);
      border-radius:8px; padding:11px 14px;
      font-size:13px; color:var(--danger); display:none; line-height:1.4;
      margin-bottom: 16px;
    }
    .error-box.show { display:block; animation:shake .3s ease; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25%      { transform:translateX(-6px); }
      75%      { transform:translateX(6px); }
    }

    .spinner {
      display:inline-block; width:16px; height:16px;
      border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
      border-radius:50%; animation:spin .6s linear infinite;
      vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    footer {
      text-align:center; padding:20px;
      font-size:12px; color:var(--muted); flex-shrink:0;
    }
  </style>
</head>
<body>
<div class="geo-stripe"></div>

<div class="page">
  <div class="card">
    <div class="logo">
      <div class="geo-logo-badge" title="ҰБТ География">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="geoOceanIndex" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="45%" stop-color="#0284c7"/>
              <stop offset="85%" stop-color="#03446a"/>
              <stop offset="100%" stop-color="#082f49"/>
            </radialGradient>
            <linearGradient id="geoGoldIndex" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="50%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
            <linearGradient id="geoLandIndex" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="100%" stop-color="#15803d"/>
            </linearGradient>
          </defs>
          <!-- Brass Globe Stand Arc -->
          <path d="M8 8 A14 14 0 0 0 21 31" stroke="url(#geoGoldIndex)" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 31 L18 34 M13 34 L23 34" stroke="url(#geoGoldIndex)" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="8.8" cy="8.5" r="1.3" fill="#fef08a"/>
          <circle cx="20.5" cy="30.5" r="1.3" fill="#fef08a"/>
          <!-- Tilted Globe -->
          <g transform="rotate(-22 18 18)">
            <circle cx="18" cy="18" r="10.5" fill="url(#geoOceanIndex)"/>
            <!-- Continents -->
            <path d="M15 11 C17 10.5, 19 11.5, 20.5 13 C21.5 14, 21 15.5, 19.5 16 C18 16.5, 17 18, 18 20 C18.5 21, 17.5 22.5, 16 22.5 C14.5 22.5, 14 20, 14.5 18 C15 16, 13.5 14.5, 13 13 C12.5 11.5, 14 11.5, 15 11 Z" fill="url(#geoLandIndex)" opacity="0.95"/>
            <path d="M10 13 C11 12.5, 12 13.5, 11.5 15 C11 16.5, 9.5 18, 10.5 20 C11 21, 10.5 22, 9.5 21.5 C8.8 21, 8.5 18, 9 16 C9.5 14, 9 13.5, 10 13 Z" fill="url(#geoLandIndex)" opacity="0.95"/>
            <circle cx="23" cy="20.5" r="1" fill="#4ade80" opacity="0.9"/>
            <!-- Parallels & Meridians -->
            <line x1="7.5" y1="18" x2="28.5" y2="18" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <path d="M9.5 13.5 Q18 15 26.5 13.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" fill="none"/>
            <path d="M9.5 22.5 Q18 21 26.5 22.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" fill="none"/>
            <line x1="18" y1="7.5" x2="18" y2="28.5" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
            <ellipse cx="18" cy="18" rx="5.5" ry="10.5" stroke="rgba(255,255,255,0.55)" stroke-width="0.75" fill="none"/>
            <path d="M11 10 A10.5 10.5 0 0 1 23 9" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          </g>
          <!-- Mini North star -->
          <path d="M29 6 L30 8 L32 9 L30 10 L29 12 L28 10 L26 9 L28 8 Z" fill="#fef08a" opacity="0.95"/>
        </svg>
      </div>
      <div>
        <div class="logo-main">ҰБТ География</div>
        <div class="logo-sub">оқыту платформасы</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Войти</button>
      <button class="tab" id="tab-reg" onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- Сообщение об ошибке -->
    <div class="error-box" id="error-box"></div>

    <!-- LOGIN -->
    <div id="form-login">
      <div class="form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="example@gmail.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
            <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('login-password', this)" title="Показать пароль" aria-label="Показать пароль">
              <!-- Closed eye icon -->
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <!-- Open eye icon -->
              <svg class="eye-open" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn-submit" id="btn-login" onclick="doLogin()">Войти</button>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="form-register" style="display:none">
      <div class="form">
        <div class="field">
          <label for="reg-name">Имя</label>
          <input type="text" id="reg-name" placeholder="Аяна Сейткали"/>
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="example@gmail.com"/>
        </div>
        <div class="field">
          <label for="reg-password">Пароль (мин. 8 символов, 1 заглавная, 1 цифра)</label>
          <div class="password-wrapper">
            <input type="password" id="reg-password" placeholder="Secret123" autocomplete="new-password"/>
            <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('reg-password', this)" title="Показать пароль" aria-label="Показать пароль">
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
              <svg class="eye-open" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="reg-role">Роль</label>
          <select id="reg-role">
            <option value="teacher">Мұғалім (Учитель)</option>
            <option value="student">Оқушы (Ученик)</option>
          </select>
        </div>
        <button class="btn-submit" id="btn-reg" onclick="doRegister()">Зарегистрироваться</button>
      </div>
    </div>
  </div>
</div>

<footer>ҰБТ География · оқыту платформасы</footer>

<script>
  // ── Если уже авторизован — редирект ───────────────────────────────────────
  (async function() {
    try {
      const r = await fetch('/api/me', { credentials:'include' });
      if (r.ok) {
        const u = await r.json();
        if (u.role === 'teacher') location.replace('/teacher_dashboard.html');
        else location.replace('/student_dashboard.html');
      }
    } catch(_) {}
  })();

  // ── Авто-заполнение сохранённого email ────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('ubt_saved_email');
    if (saved) {
      const em = document.getElementById('login-email');
      if (em && !em.value) em.value = saved;
    }
  });

  // ── Глазок: переключение видимости пароля ─────────────────────────────────
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';

    const eyeClosed = btn.querySelector('.eye-closed');
    const eyeOpen = btn.querySelector('.eye-open');
    if (eyeClosed && eyeOpen) {
      eyeClosed.style.display = isPassword ? 'none' : 'block';
      eyeOpen.style.display   = isPassword ? 'block' : 'none';
    }
    const tip = isPassword ? 'Скрыть пароль' : 'Показать пароль';
    btn.setAttribute('title', tip);
    btn.setAttribute('aria-label', tip);
    input.focus();
  }

  function switchTab(tab) {
    document.getElementById('form-login').style.display    = tab==='login'    ? '' : 'none';
    document.getElementById('form-register').style.display = tab==='register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active', tab==='login');
    document.getElementById('tab-reg').classList.toggle('active',   tab==='register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('error-box');
    el.textContent = msg;
    el.className = 'error-box show';
  }
  function hideError() {
    document.getElementById('error-box').className = 'error-box';
  }

  function setBusy(btn, on) {
    btn.disabled = on;
    if (on) { btn._t = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>Жүктелуде...'; }
    else     { btn.innerHTML = btn._t; }
  }

  async function doLogin() {
    hideError();
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showError('Барлық өрістерді толтырыңыз / Заполните все поля'); return; }

    const btn = document.getElementById('btn-login');
    setBusy(btn, true);
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const d = await r.json();
      if (!r.ok) {
        showError(d.message || 'Қате email немесе құпия сөз / Неверный email или пароль');
        return;
      }

      localStorage.setItem('ubt_saved_email', email);

      if (d.role === 'teacher') location.replace('/teacher_dashboard.html');
      else location.replace('/student_dashboard.html');
    } catch(_) {
      showError('Сервермен байланыс жоқ / Нет соединения с сервером');
    } finally {
      setBusy(btn, false);
    }
  }

  async function doRegister() {
    hideError();
    const username = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const role     = document.getElementById('reg-role').value;

    if (!username || !email || !password) { showError('Барлық өрістерді толтырыңыз / Заполните все поля'); return; }

    const btn = document.getElementById('btn-reg');
    setBusy(btn, true);
    try {
      const r = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, email, password, role })
      });
      const d = await r.json();
      if (!r.ok) { showError(d.message || 'Тіркелу қатесі / Ошибка регистрации'); return; }

      localStorage.setItem('ubt_saved_email', email);

      // Авто-логин после регистрации
      const r2 = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const d2 = await r2.json();
      if (d2.role === 'teacher') location.replace('/teacher_dashboard.html');
      else location.replace('/student_dashboard.html');
    } catch(_) {
      showError('Сервермен байланыс жоқ / Нет соединения с сервером');
    } finally {
      setBusy(btn, false);
    }
  }

  // Enter пернесі
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('form-login').style.display !== 'none';
    if (loginVisible) doLogin(); else doRegister();
  });
</script>
</body>
</html>
